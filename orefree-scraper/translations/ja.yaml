network:
  8000/tcp: サーバーがリッスンするポート
configuration:
  port:
    name: ポート
    description: サーバーがリッスンするポート。ネットワークポートと同じ値を入力してください。
  log_level:
    name: ログレベル
    description: サーバーのログレベル
  default_value:
    name: デフォルト値
    description: スクレイピングがタイムアウトした際にエラーの代わりに返す値。timetomorrow では、単一の時間帯 HH:mm - HH:mm を今日と明日の両方に使用します。無効にするには空のままにします。リクエストごとに default_value クエリパラメータで上書きできます。
